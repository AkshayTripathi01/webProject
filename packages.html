<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Packages - Incredible India Travel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fas fa-umbrella-beach"></i> Incredible India Travel
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="destinations.html">Destinations</a></li>

                <li id="authLinks">
                    <a href="login.html" class="btn-login">Login</a>
                    <a href="register.html" class="btn-register">Register</a>
                </li>
                <li id="userLinks" style="display:none;">
                    <span id="userName" class="user-name"></span>
                    <a href="#" id="logoutBtn" class="btn-logout">Logout</a>

        <div class="search-filter">
            <input type="text" id="packageSearch" placeholder="Search packages...">

        </div>
    </div>

    <div class="packages-grid" id="allPackages"></div>

    <footer>

        </div>
    </footer>

    <script src="js/main.js"></script>

        document.addEventListener('DOMContentLoaded', () => {
            loadAllPackages();
        });
    </script>
